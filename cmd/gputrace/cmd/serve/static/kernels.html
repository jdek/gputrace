<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernels - GPU Trace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Kernels</h1>
            <p class="text-gray-600 mt-2">List of all kernel functions in the trace</p>
        </header>

        <nav class="mb-8">
            <ul class="flex space-x-4 border-b border-gray-300 pb-2">
                <li><a href="/" class="text-gray-600 hover:text-blue-600">Dashboard</a></li>
                <li><a href="/kernels" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-2">Kernels</a></li>
                <li><a href="#" class="text-gray-400 cursor-not-allowed">API Calls</a></li>
                <li><a href="#" class="text-gray-400 cursor-not-allowed">Encoders</a></li>
                <li><a href="#" class="text-gray-400 cursor-not-allowed">Buffers</a></li>
            </ul>
        </nav>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Search kernels..."
                           class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                    <svg class="w-5 h-5 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div class="text-sm text-gray-500" id="kernel-count">Loading...</div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody id="kernels-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be inserted here -->
                        <tr>
                            <td colspan="3" class="px-6 py-4 text-center text-gray-500">Loading kernels...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allKernels = [];

        async function fetchKernels() {
            try {
                const response = await fetch('/api/kernels');
                const data = await response.json();
                allKernels = data.kernels;
                renderKernels(allKernels);
                document.getElementById('kernel-count').textContent = `${allKernels.length} kernels found`;
            } catch (error) {
                console.error('Error fetching kernels:', error);
                document.getElementById('kernels-table-body').innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Error loading kernels.</td></tr>';
            }
        }

        function renderKernels(kernels) {
            const tbody = document.getElementById('kernels-table-body');

            if (kernels.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No kernels found.</td></tr>';
                return;
            }

            tbody.innerHTML = kernels.map(k => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#${k.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 font-mono">${k.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="#" class="text-blue-600 hover:text-blue-900 cursor-not-allowed" title="Details coming soon">Details</a>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allKernels.filter(k => k.name.toLowerCase().includes(term));
            renderKernels(filtered);
            document.getElementById('kernel-count').textContent = `${filtered.length} kernels found`;
        });

        document.addEventListener('DOMContentLoaded', fetchKernels);
    </script>
</body>
</html>
